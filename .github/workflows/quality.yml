name: Quality

on:
  push:
  pull_request:

jobs:
  managed-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check repository language
        run: python scripts/check_english_sources.py
      - name: Run managed tests
        run: dotnet run --project tests/StaticMap.Tests/StaticMap.Tests.csproj -c Release
